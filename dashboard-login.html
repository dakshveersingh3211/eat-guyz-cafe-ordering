<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EAT GUYZ CAFE - Dashboard Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111, #2b1b12);
            color: white;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 35px 28px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            text-align: center;
        }

        .logo {
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #bbb;
            font-size: 14px;
            margin-bottom: 28px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: none;
            outline: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
        }

        input::placeholder {
            color: #aaa;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #f59e0b;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .error {
            display: none;
            margin-top: 15px;
            color: #ff6b6b;
            font-size: 14px;
        }

        .loading {
            display: none;
            margin-top: 15px;
            color: #ccc;
            font-size: 14px;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <div class="logo">🍽️</div>

        <h1>EAT GUYZ CAFE</h1>

        <p class="subtitle">
            Staff Dashboard Login
        </p>

        <form id="loginForm">

            <input
                type="password"
                id="password"
                placeholder="Enter dashboard password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                LOGIN
            </button>

        </form>

        <div id="loading" class="loading">
            Checking password...
        </div>

        <div id="error" class="error">
            Incorrect password. Please try again.
        </div>

    </div>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const passwordInput =
            document.getElementById("password");

        const errorMessage =
            document.getElementById("error");

        const loadingMessage =
            document.getElementById("loading");


        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                errorMessage.style.display = "none";

                loadingMessage.style.display = "block";

                try {

                    const response = await fetch(
                        "/api/dashboard/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials: "same-origin",

                            body: JSON.stringify({
                                password:
                                    passwordInput.value
                            })
                        }
                    );

                    const result =
                        await response.json();

                    if (result.success) {

                        window.location.href =
                            "/dashboard";

                    } else {

                        errorMessage.textContent =
                            result.message ||
                            "Incorrect password.";

                        errorMessage.style.display =
                            "block";

                        passwordInput.value = "";

                        passwordInput.focus();

                    }

                } catch (error) {

                    errorMessage.textContent =
                        "Server connection error.";

                    errorMessage.style.display =
                        "block";

                }

                loadingMessage.style.display =
                    "none";

            }
        );

    </script>

</body>

</html>
